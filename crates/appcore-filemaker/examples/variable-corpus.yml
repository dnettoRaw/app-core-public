filemaker: '1.0'
model: document
id: variable-content-corpus
page:
  width: 595pt
  height: 842pt
  margin: {top: 36pt, bottom: 36pt, left: 36pt, right: 36pt}
  master:
    background:
      - {id: watermark, type: text, text: 'SYNTHETIC SAMPLE', x: 70pt, y: 360pt, width: 460pt, height: 70pt, z_index: -10, style: {font: Body, font_size: 38pt, color: '#e5edf2'}, transform: {rotate: -20}}
    footer:
      - {id: page-number, type: text, text: 'Page {page}/{pages} - synthetic data', x: 365pt, y: 816pt, width: 194pt, height: 12pt, style: {font: Body, font_size: 8pt}, text_options: {overflow: error}}
  first:
    footer:
      - {id: stamp, type: text, text: 'DEMONSTRATION', x: 414pt, y: 710pt, width: 130pt, height: 18pt, transform: {rotate: -12}, style: {font: Body, font_size: 10pt, color: '#758fa3'}}
elements:
  - id: identification
    type: group
    width: 523pt
    height: auto
    constraints: {min_height: 60pt}
    layout: flow_horizontal
    gap: 21pt
    children:
      - {id: sender, type: text, width: 251pt, height: auto, binding: data.sender, style: {font: Body, font_size: 9pt, line_height: 1250000}, text_options: {overflow: error}}
      - {id: recipient, type: text, width: 251pt, height: auto, binding: data.recipient, style: {font: Body, font_size: 9pt, line_height: 1250000}, text_options: {overflow: error, align_x: end}}
  - {id: title, type: text, width: 523pt, height: auto, text: 'Variable-content document', anchors: {top: identification.bottom+12pt}, style: {font: Body, font_size: 18pt, color: '#17324d'}, text_options: {overflow: error}}
  - id: entries
    type: table
    width: 523pt
    height: 770pt
    collision: {ignore: [identification, sender, recipient, title]}
    binding: data.rows
    style: {font: Body, font_size: 8pt, line_height: 1250000, color: '#263a4a'}
    table:
      columns:
        - {field: detail, header: 'Description / comments', width: {mode: fixed, value: 300pt}}
        - {field: rate, header: TVA, width: {mode: fixed, value: 45pt}, align_x: end}
        - {field: previous, header: Before, width: {mode: fixed, value: 80pt}, align_x: end}
        - {field: amount, header: Net, width: {mode: fixed, value: 98pt}, align_x: end}
      keep_together_by: group
      row_anchor_field: anchor
      header_height: 24pt
      row_height: auto
      max_rows: 1000
      max_row_fields: 8
      max_cell_bytes: 4096
      conditional_styles:
        - {when: 'data.kind == "title"', style: {font_size: 9pt, fill: '#edf3f7'}, min_height: 18pt, padding: {top: 2pt, bottom: 2pt}}
        - {when: 'data.kind == "description"', padding: {left: 10pt, top: 2pt, bottom: 2pt}}
        - {when: 'data.kind == "comment"', style: {font_size: 7.5pt, color: '#00616b'}, padding: {left: 10pt, top: 2pt, bottom: 5pt}}
  - {id: old-value-strike, type: line, x: 397pt, width: 28pt, height: 0pt, anchors: {top: 'entries::r0000.top+9pt'}, style: {stroke: '#667788', stroke_width: 0.7pt}, collision: {policy: overlay, group: decoration, collides_with: [decoration]}}
  - id: closing
    type: group
    width: 523pt
    height: auto
    layout: flow_vertical
    gap: 8pt
    anchors: {top: entries.bottom+12pt}
    children:
      - {id: summary, type: text, width: 523pt, height: auto, binding: data.summary, style: {font: Body, font_size: 10pt, line_height: 1200000}, text_options: {overflow: error, align_x: end}}
      - {id: terms, type: text, width: 523pt, height: auto, binding: data.terms, style: {font: Body, font_size: 8pt, line_height: 1250000}, text_options: {overflow: error}}
      - {id: signature, type: text, width: 523pt, height: 12pt, text: 'Confirmation / signature: ____________________', style: {font: Body, font_size: 9pt}, text_options: {overflow: error}}
      - {id: code, type: barcode, width: 180pt, height: 38pt, binding: data.code, style: {fill: black}}
      - {id: code-label, type: text, width: 180pt, height: 10pt, binding: data.code, style: {font: Body, font_size: 8pt}, text_options: {overflow: error}}
