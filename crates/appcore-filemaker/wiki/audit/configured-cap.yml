    type: text
    x: 20pt
    y: 20pt
    width: 240pt
    height: 40pt
    text: "One\nTwo\nThree\nFour\nFive\nSix"
    style: {font: Body, font_size: 9pt}
    text_options: {overflow: wrap, max_lines: 4, line_height: 1250000}
