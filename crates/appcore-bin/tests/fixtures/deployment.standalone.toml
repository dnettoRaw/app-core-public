manifest_version = 1
installation_id = "minimal-local"
application_id = "minimal-app"
mode = "standalone"
secrets = { runtime_security = "env:APPCORE_RUNTIME_SECRET" }
paths = { storage = "storage", backup = "backups" }
volumes = []
adapters = {}
environment = {}

[supervisor.watchdog]
enabled = true
check_interval_ms = 1000
stall_timeout_ms = 15000

[storage]
provider_id = "file"
settings = {}
secret_refs = {}

[network]
listen_addresses = ["127.0.0.1:39001"]
peer_transport = "http"
command_transport = "http"

[network.tls]
enabled = false
